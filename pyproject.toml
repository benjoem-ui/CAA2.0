[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caa2"
version = "0.1.0"
description = "CAA2.0: Read-only Reddit research and drafting assistant (human-in-the-loop)"
requires-python = ">=3.10"
dependencies = [
  "praw>=7.7.1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
